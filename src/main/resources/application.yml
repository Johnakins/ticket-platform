server:
  port: ${PORT:8081}

spring:
  datasource:
#    url: ${DATABASE_URL:jdbc:postgresql://host.docker.internal:5432/ticket}
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticket}
    username: ${DB_USERNAME:john}
    password: ${DB_PASSWORD:john}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      fail-on-empty-beans: false