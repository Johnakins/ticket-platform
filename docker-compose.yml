services:
  postgres:
    image: postgres:16
    container_name: ticket-platform-db
    environment:
      POSTGRES_DB: ticket_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ticket_platform_data:/var/lib/postgresql/data
volumes:
  ticket_platform_data:
