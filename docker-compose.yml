services:
  postgres:
    image: postgres
    restart: unless-stopped
    container_name: ticket-platform-db
    environment:
      POSTGRES_DB: ticket
      POSTGRES_USER: john
      POSTGRES_PASSWORD: john
    ports:
      - "5432:5432"
    volumes:
      - "C:/Users/User/Desktop/db-volumes/ticket-db:/var/lib/postgresql"

